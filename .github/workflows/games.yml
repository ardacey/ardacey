name: Games

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Tüm hamleler sırayla işlensin, çakışma olmasın
concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'chess:') || startsWith(github.event.issue.title, 'boss:')
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Issue başlığı ve kullanıcı adı kullanıcı girdisidir: shell'e değil, ortam değişkenine verilir.
      - name: Hamleyi işle
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: python scripts/dispatch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data games
          git diff --cached --quiet || git commit -m "game: #${{ github.event.issue.number }} işlendi"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 3; done

      - name: Issue'ya cevap yaz ve kapat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE_NUMBER" --reason completed
