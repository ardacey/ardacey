name: Light the City

on:
  schedule:
    - cron: "17 * * * *"   # new followers
  watch:
    types: [started]       # new stars, right away
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lights
  cancel-in-progress: false

jobs:
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Light windows for followers and stargazers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/lights/generate.py

      - name: Push city
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: light the city"
          add: "assets/lights.svg README.md .github/lights/visitors.json"
          default_author: github_actions
