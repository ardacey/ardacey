name: Light a Window

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: lights
  cancel-in-progress: false

jobs:
  light:
    if: startsWith(github.event.issue.title, 'light:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Light a window for the visitor
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: python .github/lights/generate.py "$LOGIN"

      - name: Push city
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: light a window"
          add: "assets/lights.svg README.md .github/lights/visitors.json"
          default_author: github_actions

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "A window in the city is now lit in your name. Thanks for stopping by 🏮"
          gh issue close "$NUMBER" --repo "$REPO"
