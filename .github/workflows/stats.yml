name: Update Stats

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pillow==12.3.0 fonttools==4.67.0
          python .github/stats/generate.py

      - name: Push stats cards
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update stats cards"
          add: "assets/stats/*.svg"
